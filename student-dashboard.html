<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard: View Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card container">
        <h1>Welcome back, Student</h1>
        <p class="subtitle">Your results can be viewed from below</p>
        <table class="results-table">
            <thead>
                <tr>
                    <th>Course</th>
                    <th> Continuous Assessment Score</th>
                    <th> Exam Score</th>
                    <th> Total Score</th>
                    <th> Grade</th>
                </tr>
            </thead>
            <tbody id="results body"></tbody>
        </table>
        <div class="gpa-container">
            <div class="gpa-card">
                <h2> GPA</h2>
                <p class="gpa-value" id="sessionGpa"></p>
            </div>
            <div class="gpa-card">
                <h2>Cumulative GPA (CGPA)</h2>
                <p class="gpa-value" id="cumulativeGpa"></p>
            </div>
        </div>
        
    </div>
    
</body>
</html>
