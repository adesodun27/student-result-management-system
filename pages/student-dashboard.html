<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acadex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile">
        <h2>Welcome back, Student</h2>
        <div class="name">
            <h3>Student Name:</h3>
            <p class="student-id" id="studentName"></p>
        </div>
        <div class="matric-number`">
            <h3>Matric Number</h3>
            <p class="student-id" id="MatricNumber"></p>
        </div>
        <div class="department">
            <h3> Department:</h3>
            <p class="student-id" id="department"></p>
        </div>
        <div class="level">
            <h3>Level:</h3>
        </div>
    </div>
    <div class="card container">
        <p class="subtitle">Your results can be viewed from below</p>
        <table class="results-table">
            <thead>
                <tr>
                    <th>Course</th>
                    <th> Continuous Assessment Score</th>
                    <th> Exam Score</th>
                    <th> Total Score</th>
                    <th> Grade</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
        <div class="gpa-container">
            <div class="gpa-card">
                <h3> GPA</h3>
                <p class="gpa-value" id="sessionGpa"></p>
            </div>
            <div class="gpa-card">
                <h3>Cumulative GPA (CGPA)</h3>
                <p class="gpa-value" id="cumulativeGpa"></p>
            </div>
        </div>
        
    </div>
    
</body>
<footer></footer>
</html>
