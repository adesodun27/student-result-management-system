<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students · ACADEX</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
  <div class="logo"><h2>ACADEX</h2></div>
  <button class="hamburger" id="hamburger" title="Menu" aria-label="Menu">☰</button>
</div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="nav-link">Dashboard</a>
        <a href="admin-students.html" class="nav-link">Students</a>
        <a href="admin-lecturers.html" class="nav-link">Lecturers</a>
        <a href="admin-courses.html" class="nav-link">Courses</a>
        <a href="admin-assignments.html" class="nav-link">Assignments</a>
        <a href="admin-approvals.html" class="nav-link">Approvals</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="admin-login.html" class="nav-link logout">Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <section class="page-head">
        <h1>Students</h1>
        <p>Register and manage students</p>
      </section>

      <!-- Add form -->
      <div class="form-card">
        <h3>Add a student</h3>
        <div class="form-row">
          <div class="form-field">
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="e.g. Adebayo Chidinma" />
          </div>
          <div class="form-field">
            <label for="matric">Matric Number</label>
            <input id="matric" type="text" placeholder="e.g. CSC/2021/001" />
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="e.g. student@acadex.edu" />
          </div>
          <div class="form-field small">
            <label for="level">Level</label>
            <select id="level" title="Select level">
              <option value="">—</option>
              <option>100</option>
              <option>200</option>
              <option>300</option>
              <option>400</option>
              <option>500</option>
            </select>
          </div>
          <button class="course-button" id="addBtn">Add Student</button>
        </div>
        <p class="form-error" id="formError"></p>
      </div>

      <!-- List -->
      <div class="table-wrap">
        <table class="scores">
          <thead>
            <tr>
              <th>Matric No.</th>
              <th>Full Name</th>
              <th>Email</th>
              <th class="r">Level</th>
              <th class="r">Action</th>
            </tr>
          </thead>
          <tbody id="studentList"></tbody>
        </table>
      </div>
    </main>

    <div id="toast"></div>

    <script src="../../js/sidebar.js"></script>
    <script src="../../js/menu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/admin-students.js"></script>
  </body>
</html>
