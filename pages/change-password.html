<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password · ACADEX</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="bg-animation">
      <div class="circle circle-1"></div>
      <div class="circle circle-2"></div>
      <div class="circle circle-3"></div>
    </div>

    <div class="portal-card">
      <div class="banner-section">
        <div class="banner-content">
          <h1 class="brand-name">ACADEX</h1>
          <h2 class="portal-title">Secure Your Account</h2>
          <p class="portal-description">
            For your security, please set a new password before continuing to your portal.
          </p>
        </div>
      </div>

      <div class="form-section">
        <div class="form-header">
          <h2>Change Password</h2>
          <p>Set a new password to continue</p>
        </div>

        <form class="login-form" id="changeForm">
          <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required />
          </div>

          <div class="input-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
          </div>

          <button type="submit" class="submit-btn">Update Password</button>
          <p class="form-error" id="changeError" style="color:#d9534f;font-size:0.85rem;margin-top:10px;"></p>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/change-password.js"></script>
  </body>
</html>
