<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses · ACADEX</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo"><h2>ACADEX</h2></div>
        <button class="hamburger" id="hamburger" title="Menu" aria-label="Menu">☰</button>
      </div>
      <nav class="sidebar-nav">
        <a href="student-dashboard.html" class="nav-link">Dashboard</a>
        <a href="result.html" class="nav-link">My Results</a>
        <a href="courses.html" class="nav-link">Courses</a>
        <a href="student-profile.html" class="nav-link">My Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="../login.html" class="nav-link logout">Logout</a>
      </div>
    </aside>

        <main class="main-content">
      <section class="lecturer-header">
        <div class="welcome-text">
          <p class="welcome-message">My Courses</p>
          <p class="lecturer-info">Courses you're registered for</p>
        </div>
        <div class="session-selector">
          <select id="sessionSelect" title="Select session">
            <option>2024/2025 · Harmattan</option>
            <option>2024/2025 · Rain</option>
          </select>
        </div>
      </section>

      <div class="attention">
        <p><strong id="unitCount">—</strong> <span id="unitLabel">registered</span></p>
      </div>

      <section class="courses-section" id="coursesSection">
        <!-- injected by JS -->
      </section>
    </main>

       <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/student/student-courses.js"></script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/menu.js"></script>
    <script src="../../js/logout.js"></script>
  </body>
</html>
