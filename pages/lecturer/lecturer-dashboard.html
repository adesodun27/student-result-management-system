<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecturer Dashboard · ACADEX</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
  <div class="logo"><h2>ACADEX</h2></div>
  <button class="hamburger" id="hamburger" title="Menu" aria-label="Menu">☰</button>
</div>
      <nav class="sidebar-nav">
        <a href="lecturer-dashboard.html" class="nav-link">Dashboard</a>
        <a href="lecturer-profile.html" class="nav-link">Profile</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="lecturer-login.html" class="nav-link logout">Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <!-- Welcome / Header -->
      <section class="lecturer-header">
        <div class="welcome-text">
          <p class="welcome-message">Welcome, Dr. Adesodun</p>
          <p class="lecturer-info">
            Staff ID · LEC/2019/0142 · Computer Science
          </p>
        </div>

        <div class="session-selector">
          <select id="sessionSelect" title="Select session">
          <option value="2024/2025|Harmattan">2024/2025 · Harmattan</option>
<option value="2024/2025|Rain">2024/2025 · Rain</option>
          </select>
        </div>
      </section>

      <!-- Summary Cards -->
      <section class="summary-cards">
        <div class="summary-card">
          <p>Assigned Courses</p>
          <h3>4</h3>
        </div>
        <div class="summary-card pending-card">
          <p>Pending</p>
          <h3>3</h3>
        </div>
        <div class="summary-card submitted-card">
          <p>Submitted</p>
          <h3>1</h3>
        </div>
        <div class="summary-card approved-card">
          <p>Approved</p>
          <h3>0</h3>
        </div>
      </section>

  

      <!-- My Courses -->
      <section class="courses-section">
        <div class="section-title">
          <h2>My Courses</h2>
          <span>2024/2025 · Harmattan Semester</span>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase-config.js"></script>
<script src="../../js/lecturer-dashboard.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/menu.js"></script>
  </body>
</html>
