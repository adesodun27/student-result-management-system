<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile · ACADEX</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
  <div class="logo"><h2>ACADEX</h2></div>
  <button class="hamburger" id="hamburger" title="Menu" aria-label="Menu">☰</button>
</div>
     <nav class="sidebar-nav">
  <a href="lecturer-dashboard.html" class="nav-link">Dashboard</a>
  <a href="lecturer-courses.html" class="nav-link">Courses</a>
  <a href="bulk-upload.html" class="nav-link">Upload Results</a>
  <a href="lecturer-profile.html" class="nav-link">Profile</a>
</nav>
      <div class="sidebar-bottom">
        <a href="../login.html" class="nav-link logout">Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <section class="page-head">
        <h1>My Profile</h1>
        <p>Your account details</p>
      </section>

      <div class="profile-card">
        <div class="profile-top">
          <div class="avatar" id="avatar">-</div>
          <div>
            <h2 id="lecturerName">-</h2>
            <span class="profile-role">Lecturer</span>
          </div>
        </div>

        <div class="profile-details">
          <div class="detail-row">
            <span class="detail-label">Full Name</span>
            <span class="detail-value" id="fullName">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Staff ID</span>
            <span class="detail-value" id="staffId">-</span>
          </div>
          <div class="detail-row">
  <span class="detail-label">Email</span>
  <span class="detail-value" id="email">-</span>
</div>
          <div class="detail-row">
            <span class="detail-label">Department</span>
            <span class="detail-value" id="department">-</span>
          </div>
        </div>

        <p class="profile-note">
          To update your details, contact the administrator.
        </p>
      </div>
    </main>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/lecturer/lecturer-profile.js"></script>
    <script src="../../js/sidebar.js"></script>
    <script src="../../js/menu.js"></script>
    <script src="../../js/logout.js"></script>
  </body>
</html>
